name: Tests

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup specific node version
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup/Retrieve npm build chache
        uses: bahmutov/npm-install@v1

      - name: Run tests
        run: npm i && npm run test
